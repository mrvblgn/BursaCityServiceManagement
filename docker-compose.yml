# ==============================================================================
# Bursa City Service Management System (BCSMS) - Docker Compose Configuration
# ==============================================================================

services:
  # Database Service (PostgreSQL 16 Alpine)
  db:
    image: postgres:16-alpine
    container_name: bcsms-db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bcsms}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-BcsmsLocalDevPassword2026!}"
    ports:
      # Optional host exposure for local inspection / PostgreSQL tools (avoids host 5432 collisions)
      - "5433:5432"
    volumes:
      - bcsms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-bcsms}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Backend Web API (.NET 8)
  api:
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
    container_name: bcsms-api
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-bcsms};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-BcsmsLocalDevPassword2026!};"
      JwtSettings__Secret: "${JWT_SECRET:-BursaCityServiceManagementSystemSafeDevelopmentKey2026!}"
      JwtSettings__Issuer: "BCSMS.API"
      JwtSettings__Audience: "BCSMS.Web"
      Database__ApplyMigrations: "${DATABASE_APPLY_MIGRATIONS:-true}"
      Database__SeedDemoData: "${DATABASE_SEED_DEMO_DATA:-true}"
    ports:
      - "5123:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Web Application (React + Nginx)
  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: bcsms-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  bcsms_postgres_data:
    name: bcsms_postgres_data
